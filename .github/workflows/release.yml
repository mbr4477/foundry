name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build foundryd (amd64 Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            foundry/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('foundry/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        working-directory: foundry
        run: cargo build --release -p foundryd

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: foundry/target/release/foundryd
