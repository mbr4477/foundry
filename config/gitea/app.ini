APP_NAME = Gitea

[database]
DB_TYPE = sqlite3
PATH    = /data/gitea/gitea.db

[server]
DOMAIN    = localhost
HTTP_PORT = 3000
ROOT_URL  = http://localhost:3000/

[webhook]
ALLOWED_HOST_LIST = foundryd,localhost,*
SKIP_TLS_VERIFY   = true

[security]
INSTALL_LOCK = true

[log]
MODE      = console
LEVEL     = info
ROOT_PATH = /data/gitea/log
